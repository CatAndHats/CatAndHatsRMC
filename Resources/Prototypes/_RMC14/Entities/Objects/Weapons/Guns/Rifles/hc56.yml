- type: entity
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  name: HC-56 Carbine
  id: RMCWeaponRifleHC56
  description: The HC-56 Carbine is a short-barrel carbine designed for use among Law Enforcement and Security firms. Produced by Halcyon Systems, this firearm has seen testing and use among the PaP and TSEPA.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/hc56.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/hc56.rsi
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: RMCType71Shoot
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 5
    scatterWielded: 3
    scatterUnwielded: 11
    baseFireRate: 5
    burstScatterMult: 1
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.5
    accuracyMultiplierUnwielded: 0.5
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: RMCMagazineRifleHC56
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/m41_unload.ogg
        priority: 2
        whitelist:
          tags:
          - RMCMagazineRifleHC56
  - type: GunDamageModifier
    multiplier: 1.2
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentExtendedCompensator
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
          - RMCAttachmentS42xTelescopicMiniscope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentGyroscopicStabilizer
          - RMCAttachmentLaserSight
          - RMCAttachmentU1GrenadeLauncher
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentVerticalGrip
          - RMCAttachmentUnderbarrelExtinguisher
          - RMCAttachmentMiniFlamethrower
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.84, 0.07
      rmc-aslot-rail: 0.15, 0.15
      rmc-aslot-underbarrel: 0.4, -0.2
  - type: Tag
    tags:
    - RMCWeaponRifleHC56

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineRifleHC56
  name: HC-56 Carbine Magazine (5.56x45mm)
  description: "A magazine of 5.56x45mm rounds for use in the HC-56 Carbine."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleHC56
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - RMCCartridgeRifleL83A # Whoever implemented the L83s did it in a really annoying way
    proto: RMCCartridgeRifleL83A # Cross-compatible cartridges are L83A to let them fit in either mag
    capacity: 35
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/hc56.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance

- type: Tag
  id: RMCWeaponRifleHC56

- type: Tag
  id: RMCMagazineRifleHC56
