- type: entity
  abstract: true
  parent: RadioHandheld
  id: RMCRadioHandheldColonyBase
  name: shortwave radio
  description: ""
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/radio.rsi
    state: walkietalkie
    layers: []
  - type: Item
    sprite: _RMC14/Objects/Devices/radio.rsi
  - type: RadioMicrophone
    enabled: true
    broadcastChannel: ColonyHandheld
    ignoreXenos: true
  - type: RadioSpeaker
    enabled: true
    channels:
    - ColonyHandheld
  - type: PhysicalComposition
    materialComposition:
      CMSteel: 75
      CMGlass: 25

- type: entity
  parent: RMCRadioHandheldColonyBase
  id: RMCRadioHandheldColony
  suffix: On
  components:
  - type: ActiveListener
    range: 4
  - type: ActiveRadio
    channels:
    - ColonyHandheld

- type: entity
  parent: RMCRadioHandheldColonyBase
  id: RMCRadioHandheldColonyOff
  suffix: Off
  components:
  - type: RadioMicrophone
    enabled: false
  - type: RadioSpeaker
    enabled: false

- type: entity
  parent: RMCRadioHandheldColonyBase
  id: RMCRadioHandheldAlmayer
  suffix: On
  components:
  - type: ActiveListener
    range: 4
  - type: ActiveRadio
    channels:
    - MarineCommon
  - type: RadioSpeaker
    channels:
    - MarineCommon

# Prop Radio
- type: entity
  parent: BaseItem
  id: RMCPortableMusicRadio
  name: Novaris SynSound 12 portable radio
  description: The Novaris SynSound (Pronounced "Sine Sound") 12 is the latest piece of affordable and portable radio tech from Novaris. Compared to the SynSound 11, it features a smoother sound, as well as the ability to save radio stations for quick access.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Devices/portable_radio.rsi
    layers:
    - state: radio_off
      map: [ "enum.ToggleableVisuals.Enabled" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Enabled:
          True: { state: radio_on }
          False: { state: radio_off }
    sprite: _RMC14/Objects/Devices/portable_radio.rsi
  - type: Item
    size: Normal
    sprite: _RMC14/Objects/Devices/portable_radio.rsi
  - type: ItemToggle
    activated: true
  - type: Appearance
  - type: AmbientSound #TODO: Have toggling disable the sound.
    volume: -15
    range: 5
    enabled: true
    sound:
      path: /Audio/_RMC14/Ambience/am-radio-static.ogg
      params:
        loop: true
  - type: PointLight
    enabled: true
    castShadows: false
    radius: 1.3
    color: "#3ca375"
  - type: ItemTogglePointLight
