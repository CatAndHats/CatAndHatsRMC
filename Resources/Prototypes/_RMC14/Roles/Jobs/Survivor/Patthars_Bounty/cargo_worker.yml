- type: job
  parent: CMSurvivorEngineer
  id: RMCSurvivorPattharsCargoWorker
  name: rmc-job-name-survivor-cargo-worker
  description: cm-job-description-survivor
  playTimeTracker: CMJobSurvivorEngineer
  startingGear: RMCGearSurvivorPattharsCargoWorker
  spawnMenuRoleName: Cargo Worker (Patthars Survivor)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Skills
      preset: RMCSkillPresetSurvivorCargoWorker
    - type: RMCSurvivor
    - type: MotionDetectorTracked
    - type: NpcFactionMember
      factions:
      - Civilian
    - type: IntelRescueSurvivorObjective
    - type: RMCAllowSuitStorage
    - type: EquipSurvivorPreset
      preset: RMCGearSurvivorPresetCargoWorker
  useLoadoutOfJob: CMSurvivorEngineer # for inheritance

- type: startingGear
  id: RMCGearSurvivorPattharsCargoWorker
  equipment:
    jumpsuit: RMCJumpsuitCivilianFrontier
    gloves: CMHandsBrown
    id: CMIDCardColonistEngineer
    ears: CMHeadsetColony
    pocket1: RMCPouchSurvivalFill
    pocket2: RMCPouchToolsFill
    back: CMSatchelEngineerSurvivorFill

- type: entity
  parent: RMCSurvivorPresetEngineer
  id: RMCGearSurvivorPresetCargoWorker
  name: cargo worker preset
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityPreset
    randomOutfits:
    - [ RMCShoesJackboots, RMCHazardVest, RMCHardhatBlue ]
    - [ RMCShoesJackboots, RMCHazardVestBlue, RMCHardhatWhite, RMCMaskRebreather ]
    - [ RMCShoesBlack, RMCCorporateDutyJacket, RMCHeadBeanieCargo ]
